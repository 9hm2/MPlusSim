name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Függőségek
        run: npm install
      - name: Android projekt
        run: |
          npx cap add android
          npx cap sync android
      - name: Verziószám
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Állandó aláíró kulcs a build.gradle-ben
        run: |
          python3 - <<'PY'
          p = 'android/app/build.gradle'
          s = open(p).read()
          cfg = """    signingConfigs {
                  debug {
                      storeFile file("${rootDir}/../signing/debug.keystore")
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          """
          i = s.index('android {') + len('android {')
          s = s[:i] + '\n' + cfg + s[i:]
          open(p, 'w').write(s)
          PY
          grep -n -A6 "signingConfigs" android/app/build.gradle
      - name: APK fordítás
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../MPlusSim.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MPlusSim-apk
          path: MPlusSim.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: M+ Szimulátor 1.0.${{ github.run_number }}
          files: MPlusSim.apk
          make_latest: true
